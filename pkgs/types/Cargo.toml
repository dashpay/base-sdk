[package]
name = "dash-types"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = ["bitcoin-consensus-encoding/std", "hex-conservative?/std"]
full = ["std"]
_internal = []

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false }
hex-conservative = { version = "0.3", default-features = false, features = [
  "alloc",
], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.rust-version]
workspace = true
