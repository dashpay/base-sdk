[package]
name = "dash-types"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
std = [
  "bitcoin-consensus-encoding?/std",
  "bitcoin-primitives?/std",
  "hex-conservative?/std",
]
full = ["std", "codec", "serde", "bitcoin-primitives"]
codec = ["dep:bitcoin-consensus-encoding", "dep:dash-types-marker"]
bitcoin-primitives = [
  "codec",
  "dep:base58ck",
  "dep:bitcoin-primitives",
  "dep:bitcoin_hashes",
]
serde = ["dep:serde", "dep:hex-conservative"]

[dependencies]
base58ck = { workspace = true, optional = true, features = ["alloc"] }
bitcoin-consensus-encoding = { workspace = true, optional = true }
bitcoin_hashes = { workspace = true, optional = true, features = ["alloc"] }
bitcoin-primitives = { workspace = true, optional = true, features = ["alloc"] }
cfg-if = "1"
dash-types-marker = { version = "0.0.0", path = "marker", optional = true }
hex-conservative = { workspace = true, features = [
  "alloc",
], optional = true }
subtle = { workspace = true }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }
zeroize = { workspace = true }

[dev-dependencies]
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
