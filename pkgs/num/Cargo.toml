[package]
name = "dash-num"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["codec"]
std = [
  "bitcoin-consensus-encoding?/std",
  "dash-types/std",
  "hex-conservative/std",
]

codec = [
  "dash-types/codec",
  "dep:bitcoin-consensus-encoding",
]
full = [
  "codec",
  "serde",
  "std",
]
serde = [
  "codec",
  "dash-types/serde",
  "dep:serde",
]

[dependencies]
bitcoin-consensus-encoding = { workspace = true, optional = true }
dash-types = { version = "0.1.0-beta", path = "../types", default-features = false }
hex-conservative = { workspace = true }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
hex-literal = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "hash"
path = "tests/hash.rs"

[[test]]
name = "arith"
path = "tests/arith.rs"

[[test]]
name = "compact"
path = "tests/compact.rs"

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]

[[bench]]
name = "num"
path = "bench/main.rs"
harness = false

[lints]
workspace = true
