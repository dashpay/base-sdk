[package]
name = "dash-pkc"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes = { version = "0.8", default-features = false, features = [
  "zeroize",
], optional = true }
base58ck = { workspace = true, optional = true, features = ["alloc"] }
bitcoin_hashes = { workspace = true, features = ["alloc"] }
blst = { version = "0.3", default-features = false, optional = true }
ff = { version = "0.14", default-features = false, optional = true }
group = { version = "0.14", default-features = false, optional = true }
cfg-if = "1"
dash-num = { version = "0.1.0-beta", path = "../num", default-features = false }
dash-types = { version = "0.1.0-beta", path = "../types", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = [
  "fast",
  "rand_core",
  "signature",
  "zeroize",
], optional = true }
hex-conservative = { workspace = true, features = [
  "alloc",
] }
secp256k1 = { version = "0.33.1", default-features = false, features = [
  "alloc",
  "recovery",
], optional = true }
rand_core = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
getrandom = { version = "0.4", features = ["sys_rng"] }
hex-conservative = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[features]
default = []
std = ["base58ck?/std", "bitcoin_hashes/std", "dash-types/std"]
bls = [
  "dep:aes",
  "dep:blst",
  "dep:ff",
  "dep:group",
  "dep:rand_core",
  "dep:sha2",
]
codec = [
  "dep:base58ck",
  "dash-num/codec",
  "dash-types/codec",
]
ecdsa = ["dep:rand_core", "dep:secp256k1"]
eddsa = ["dep:ed25519-dalek", "dep:rand_core"]
serde = ["codec", "dep:serde", "dash-num/serde", "dash-types/serde"]
full = ["bls", "codec", "ecdsa", "eddsa", "serde", "std"]

[lints]
workspace = true

[[bench]]
name = "pkc"
path = "bench/main.rs"
harness = false
