[package]
name = "dash-pkc"
version = "0.0.0"
edition = "2021"
license = "MIT"

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
blst = { version = "0.3", default-features = false, optional = true }
cfg-if = "1"
dash-num = { version = "0.0.0", path = "../num" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
hex-conservative = { version = "0.3", optional = true }
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false, features = [
  "arithmetic",
  "ecdsa",
  "sha256",
], optional = true }
rand_core = { version = "0.6", default-features = false }
rayon = { version = "1", optional = true }
rstest = { version = "0.25", optional = true }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
hex-conservative = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[features]
default = []
std = ["dep:rayon", "rand_core/getrandom", "dash-types/std"]
bls = ["dep:blst", "dep:sha2"]
ecdsa = ["dep:k256"]
serde = ["dep:serde", "dash-types/serde"]
full = ["ecdsa", "bls", "serde", "std", "tests"]
tests = ["std", "dep:hex-conservative", "dep:rstest"]

[lints]
workspace = true

[package.rust-version]
workspace = true

[[bench]]
name = "pkc"
path = "bench/main.rs"
harness = false
required-features = ["tests"]

[[test]]
name = "bls_chia_aggregate"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_dh"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_keygen"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_llmq"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_ser"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_sign"
required-features = ["bls", "tests"]

[[test]]
name = "bls_chia_threshold"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_aggregate"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_dh"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_keygen"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_llmq"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_pop"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_sign"
required-features = ["bls", "tests"]

[[test]]
name = "bls_ietf_threshold"
required-features = ["bls", "tests"]

