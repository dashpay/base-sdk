[package]
name = "dash-script"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = [
  "base58ck/std",
  "bitcoin-consensus-encoding/std",
  "dash-pkc/std",
  "dash-types/std",
]
full = ["std", "serde"]
serde = ["dep:serde", "dash-pkc/serde", "dash-types/serde"]

[dependencies]
base58ck = { workspace = true, features = ["alloc"] }
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
dash-num = { version = "0.0.0", path = "../num", default-features = false }
dash-pkc = { version = "0.0.0", path = "../pkc", default-features = false }
dash-types = { version = "0.0.0", path = "../types", default-features = false, features = [
  "bitcoin-primitives",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
hex-conservative = "0.3"
rstest = "0.25"

[lints]
workspace = true

[package.rust-version]
workspace = true
