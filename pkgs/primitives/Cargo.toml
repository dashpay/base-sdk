[package]
name = "dash-primitives"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = [
  "base58ck/std",
  "bitcoin-consensus-encoding/std",
  "bitcoin-internals/std",
  "bitcoin_hashes/std",
  "bitcoin-units/std",
  "dash-num/std",
  "dash-pkc/std",
  "dash-pow/std",
  "dash-script/std",
  "dash-types/std",
  "hex-conservative/std",
]
serde = [
  "dep:serde",
  "bitcoin-units/serde",
  "dash-num/serde",
  "dash-pkc/serde",
  "dash-script/serde",
  "dash-types/serde",
]
full = ["std", "serde"]

[dependencies]
base58ck = { version = "0.4", default-features = false, features = ["alloc"] }
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
bitcoin-internals = { version = "0.5", default-features = false }
bitcoin_hashes = { version = "0.20", default-features = false, features = [
  "alloc",
] }
bitcoin-units = { version = "0.3", default-features = false, features = [
  "alloc",
] }
dash-num = { version = "0.0.0", path = "../num" }
dash-pkc = { version = "0.0.0", path = "../pkc", default-features = false }
dash-pow = { version = "0.0.0", path = "../pow" }
dash-script = { version = "0.0.0", path = "../script" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
cfg-if = "1"
hex-conservative = { version = "0.3", default-features = false, features = ["alloc"] }
libm = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
hex-literal = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[package.rust-version]
workspace = true
