[package]
name = "dash-p2p-core"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
std = [
  "dash-pkc/std",
  "dash-primitives/std",
  "dash-script/std",
  "dash-types/std",
]
serde = [
  "dep:serde",
  "dash-num/serde",
  "dash-pkc/serde",
  "dash-primitives/serde",
  "dash-script/serde",
  "dash-types/serde",
]
full = ["std", "serde"]

[dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
bitcoin-internals = { workspace = true }
cfg-if = "1"
dash-num = { version = "0.0.0", path = "../num", features = ["codec"] }
dash-pkc = { version = "0.0.0", path = "../pkc", features = ["codec"] }
dash-script = { version = "0.0.0", path = "../script" }
dash-params = { version = "0.0.0", path = "../params" }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-types = { version = "0.0.0", path = "../types", default-features = false, features = [
  "codec",
] }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
hex-conservative = "1.3"
rstest = "0.25"

[lints]
workspace = true
