[package]
name = "dash-p2p-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = ["dash-primitives/std"]
full = ["std"]
_internal = []

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
bitcoin-internals = { version = "0.5", default-features = false }
bitcoin-units = { version = "0.3", default-features = false, features = ["alloc"] }
dash-num = { version = "0.0.0", path = "../num" }
dash-params = { version = "0.0.0", path = "../params" }
dash-primitives = { version = "0.0.0", path = "../primitives" }

[dev-dependencies]
hex = "0.4"
hex-literal = "0.4"
rstest = "0.25"

[lints]
workspace = true

[package.rust-version]
workspace = true
