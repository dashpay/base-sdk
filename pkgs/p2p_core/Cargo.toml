[package]
name = "dash-p2p-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = ["dash-primitives/std", "dash-script/std", "dash-types/std"]
serde = [
  "dep:serde",
  "dash-num/serde",
  "dash-primitives/serde",
  "dash-script/serde",
  "dash-types/serde",
]
full = ["std", "serde"]
_internal = []

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
bitcoin-internals = { version = "0.5", default-features = false }
bitcoin-units = { version = "0.3", default-features = false, features = [
  "alloc",
] }
dash-num = { version = "0.0.0", path = "../num" }
dash-script = { version = "0.0.0", path = "../script" }
dash-params = { version = "0.0.0", path = "../params" }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["std"] }
hex-conservative = "0.3"
hex-literal = "0.4"
json5 = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.rust-version]
workspace = true
