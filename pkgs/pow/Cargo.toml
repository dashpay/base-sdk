[package]
name = "dash-pow"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = ["dep:rayon"]
full = ["std", "aes_hw", "simd"]
aes_hw = []
simd = []

[dependencies]
cfg-if = "1"
dash-num = { version = "0.0.0", path = "../num" }
rayon = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
hex-conservative = "0.3"
hex-literal = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "blake"
[[test]]
name = "bmw"
[[test]]
name = "cubehash"
[[test]]
name = "echo"
[[test]]
name = "groestl"
[[test]]
name = "jh"
[[test]]
name = "keccak"
[[test]]
name = "luffa"
[[test]]
name = "shavite"
[[test]]
name = "simd_hash"
[[test]]
name = "skein"
[[bench]]
name = "pow"
path = "bench/main.rs"
harness = false
required-features = ["std", "simd"]

[lints]
workspace = true

[package.rust-version]
workspace = true
