[package]
name = "dash-pow"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = []
full = ["std", "aes_hw", "simd"]
aes_hw = []
simd = []

[dependencies]
dash-num = { version = "0.0.0", path = "../num" }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
hex-literal = "0.4"
rstest = "0.25"

[[test]]
name = "blake"
[[test]]
name = "bmw"
[[test]]
name = "cubehash"
[[test]]
name = "echo"
[[test]]
name = "groestl"
[[test]]
name = "jh"
[[test]]
name = "keccak"
[[test]]
name = "luffa"
[[test]]
name = "shavite"
[[test]]
name = "simd_hash"
[[test]]
name = "skein"
[[bench]]
name = "pow"
path = "bench/main.rs"
harness = false
required-features = ["simd"]

[lints]
workspace = true

[package.rust-version]
workspace = true
