# Secret handling policy
extensions:
  # Dependency types that are `Copy`, leaving the original behind on move.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: allowCopyableTypes
    data:
      - ["secp256k1::SecretKey"]

  # Non-`zeroize` methods that erase a value.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: allowEraseMethods
    data:
      - ["secp256k1::SecretKey::non_secure_erase"]
      - ["secp256k1::Scalar::non_secure_erase"]

  # Dependency types that erase themselves on drop.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: erasingTypes
    data:
      # Declared `#[zeroize(drop)]`.
      - ["blst::min_pk::SecretKey"]

  # Known violations
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: ignoreLeak
    data:
      # | crate     | struct         | method        |
      # | --------- | -------------- | ------------- |
      - ["dash-pkc", "Fr",             "try_random"]
