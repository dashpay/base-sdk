rules:
  - id: derive-no-debug-secret
    message: "secret type must not derive Debug; impl manually to redact contents"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/**/*.rs, /contrib/samples/**/*.rs]
    pattern-regex: |
      (?sx)
      \#\[derive\( [^)]* \bDebug\b [^)]* \)\]
      \s*
      (?: \#\[ [^\]]* \] \s* )*         # skip intermediate attributes
      (?: pub (?: \( [^)]* \) )? \s+ )? # optional visibility
      (?:struct|enum) \s+
      \w* (?:Secret|Private|Seed|Password|Mnemonic|Share(?!d)) \w*

  - id: derive-serde-disambiguate
    message: "use ::serde:: instead of serde:: in derive attributes"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/**/*.rs, /contrib/samples/**/*.rs]
    pattern-regex: 'derive\([^)]*(?<!:)serde::'

  - id: prelude-no-use-alloc
    message: "use crate::prelude instead of alloc:: directly"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/**/*.rs]
      exclude:
        - /pkgs/**/prelude.rs
        - /pkgs/**/prelude/mod.rs
        - /contrib/samples/**
    pattern-regex: '\buse\s+(::)?alloc(::|\s)'

  - id: prelude-use-wildcards-only
    message: "use crate::prelude::* instead of named imports from prelude"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/**/*.rs]
      exclude:
        - /pkgs/**/prelude.rs
        - /pkgs/**/prelude/mod.rs
        - /contrib/samples/**
    pattern-regex: '\buse\s+crate::prelude::[^*]'

  - id: use-pub-roots-only
    message: "pub use re-exports belong in lib.rs or mod.rs, not in leaf modules"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/**/*.rs, /contrib/samples/**/*.rs]
      exclude: ["**/lib.rs", "**/mod.rs"]
    pattern-regex: '^\s*pub\s+use\s'
